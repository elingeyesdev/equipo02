openapi: 3.0.3
info:
  title: API Middleware BaaS Universal
  version: 2.0.0
  description: >-
    Contrato de la API de Blockchain como Servicio (BaaS) universal sobre
    Hyperledger Fabric. Modelo de datos GENÉRICO: cualquier sistema externo
    registra, consulta, versiona, audita y restaura activos arbitrarios como
    `{datoId, tipo, payload JSON}` en el chaincode `dato_cc`, sin conocer Fabric.

    Autenticación: cabecera obligatoria `X-API-Key`. El servidor resuelve el
    TENANT (empresa = canal Fabric) y el ROL (admin | integrador | solo_lectura)
    a partir de la clave. Las rutas bajo `/admin/` usan `X-Admin-Api-Key` y no
    forman parte de este esquema público.

    Flujo de aprobación: las escrituras de un `integrador` NO se confirman en la
    cadena; crean una SOLICITUD pendiente que un `admin` aprueba o rechaza.

    NOTA: las familias `/datos/*` y `/solicitudes/*` aceptan payload JSON libre,
    por lo que su validación se realiza en el handler (no en este contrato);
    aquí se documentan para referencia de integradores.

servers:
  - url: /
    description: Base relativa — validación OpenAPI compatible con cualquier host/puerto

tags:
  - name: datos
    description: CRUD genérico de activos universales (dato_cc), historial y restauración
  - name: aprobaciones
    description: Flujo de aprobación de cambios propuestos por integradores
  - name: chaincode
    description: Invocación controlada de chaincode (lista blanca, evaluate o submit)
  - name: eventos
    description: Monitoreo de eventos de chaincode (SSE e historial en memoria)
  - name: auditoria
    description: Bitácora HTTP del puente y notificaciones administrativas

paths:
  /datos:
    get:
      security: [{ ApiKeyAuth: [] }]
      tags: [datos]
      summary: Listar datos del tenant
      description: Consulta GetAllDatos sobre dato_cc del tenant deducido por X-API-Key. Cualquier rol.
      responses:
        '200': { description: Listado, content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaLectura' } } } }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      security: [{ ApiKeyAuth: [] }]
      tags: [datos]
      summary: Registrar dato (admin confirma; integrador propone)
      description: >-
        Admin: escribe directo (201). Integrador: crea solicitud pendiente (202).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDato' }
            example: { datoId: PARCELA-001, tipo: parcela, payload: { cultivo: maiz, hectareas: 12 } }
      responses:
        '201': { description: Dato confirmado en cadena (admin), content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaExitoTx' } } } }
        '202': { description: Cambio pendiente de aprobación (integrador), content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaPendiente' } } } }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /datos/{datoId}:
    parameters:
      - { name: datoId, in: path, required: true, schema: { type: string } }
    get:
      security: [{ ApiKeyAuth: [] }]
      tags: [datos]
      summary: Consultar dato por ID
      responses:
        '200': { description: Dato, content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaLectura' } } } }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      security: [{ ApiKeyAuth: [] }]
      tags: [datos]
      summary: Actualizar dato (admin confirma; integrador propone)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDato' }
      responses:
        '200': { description: Confirmado (admin), content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaExitoTx' } } } }
        '202': { description: Pendiente (integrador), content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaPendiente' } } } }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }
    delete:
      security: [{ ApiKeyAuth: [] }]
      tags: [datos]
      summary: Dar de baja un dato (admin confirma; integrador propone)
      responses:
        '200': { description: Confirmado (admin), content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaExitoTx' } } } }
        '202': { description: Pendiente (integrador), content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaPendiente' } } } }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /datos/{datoId}/historial:
    parameters:
      - { name: datoId, in: path, required: true, schema: { type: string } }
    get:
      security: [{ ApiKeyAuth: [] }]
      tags: [datos]
      summary: Historial inmutable de un dato
      description: Consulta GetDatoHistory de dato_cc.
      responses:
        '200': { description: Historial, content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaLectura' } } } }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /datos/{datoId}/restaurar:
    parameters:
      - { name: datoId, in: path, required: true, schema: { type: string } }
    post:
      security: [{ ApiKeyAuth: [] }]
      tags: [datos]
      summary: Restaurar una revisión histórica como NUEVO bloque
      description: >-
        Rollback inmutable: toma una revisión por txId y la re-escribe como nueva
        transacción (la cadena nunca se altera). Admin confirma; integrador propone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [txId]
              properties:
                txId: { type: string, description: TxID de la revisión a restaurar }
      responses:
        '200':
          description: Restaurado como nueva revisión (admin)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  txId: { type: string }
                  mensaje: { type: string }
                  restauradoDesdeTxId: { type: string }
        '202': { description: Pendiente (integrador), content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaPendiente' } } } }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /solicitudes:
    get:
      security: [{ ApiKeyAuth: [] }]
      tags: [aprobaciones]
      summary: Listar solicitudes del tenant
      description: Filtro opcional ?estado=pendiente|aprobada|rechazada. Cualquier rol.
      parameters:
        - { name: estado, in: query, required: false, schema: { type: string, enum: [pendiente, aprobada, rechazada] } }
      responses:
        '200':
          description: Solicitudes del tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  solicitudes:
                    type: array
                    items: { $ref: '#/components/schemas/Solicitud' }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /solicitudes/{solicitudId}:
    parameters:
      - { name: solicitudId, in: path, required: true, schema: { type: string } }
    get:
      security: [{ ApiKeyAuth: [] }]
      tags: [aprobaciones]
      summary: Consultar una solicitud
      responses:
        '200':
          description: Solicitud
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  solicitud: { $ref: '#/components/schemas/Solicitud' }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /solicitudes/{solicitudId}/aprobar:
    parameters:
      - { name: solicitudId, in: path, required: true, schema: { type: string } }
    post:
      security: [{ ApiKeyAuth: [] }]
      tags: [aprobaciones]
      summary: Aprobar una solicitud (solo admin)
      description: Ejecuta el cambio en la cadena y marca la solicitud como aprobada.
      responses:
        '200':
          description: Aprobada y confirmada en cadena
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  estado: { type: string, example: aprobada }
                  txId: { type: string }
                  mensaje: { type: string }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { description: La solicitud ya fue resuelta, content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaError' } } } }

  /solicitudes/{solicitudId}/rechazar:
    parameters:
      - { name: solicitudId, in: path, required: true, schema: { type: string } }
    post:
      security: [{ ApiKeyAuth: [] }]
      tags: [aprobaciones]
      summary: Rechazar una solicitud (solo admin)
      description: Descarta el cambio sin escribir nada en la cadena.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo: { type: string }
      responses:
        '200':
          description: Rechazada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  estado: { type: string, example: rechazada }
                  mensaje: { type: string }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { description: La solicitud ya fue resuelta, content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaError' } } } }

  /chaincode/invocar:
    post:
      security: [{ ApiKeyAuth: [] }]
      tags: [chaincode]
      summary: Invocar chaincode (lista blanca)
      description: >-
        Ejecuta evaluate o submit solo para combinaciones (contrato, función, modo,
        número de argumentos) permitidas por la política. El canal es opcional: si
        se omite se usa el canal por defecto del tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudInvocacionChaincode' }
            example: { contrato: dato_cc, funcion: ReadDato, parametros: [DATO-001], modo: evaluate }
      responses:
        '200':
          description: Evaluate exitoso o submit confirmado
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RespuestaLectura'
                  - $ref: '#/components/schemas/RespuestaExitoTx'
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { description: Error interno Fabric, content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaError' } } } }
        '502': { description: Endoso o confirmación rechazada, content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaError' } } } }
        '503': { description: Gateway no conectado / timeout, content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaError' } } } }

  /eventos/stream:
    get:
      security: [{ ApiKeyAuth: [] }]
      tags: [eventos]
      summary: Stream en vivo de eventos de chaincode (SSE)
      responses:
        '200': { description: Flujo text/event-stream, content: { text/event-stream: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /eventos/historial:
    get:
      security: [{ ApiKeyAuth: [] }]
      tags: [eventos]
      summary: Últimos eventos de chaincode en memoria
      responses:
        '200': { description: Historial reciente, content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaLectura' } } } }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /auditoria/http:
    get:
      security: [{ ApiKeyAuth: [] }]
      tags: [auditoria]
      summary: Bitácora del puente en memoria
      parameters:
        - { in: query, name: limite, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { in: query, name: desde, schema: { type: string } }
        - { in: query, name: hasta, schema: { type: string } }
      responses:
        '200': { description: Líneas de auditoría, content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaLectura' } } } }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /auditoria/combinada:
    get:
      security: [{ ApiKeyAuth: [] }]
      tags: [auditoria]
      summary: Bitácora del puente + eventos de chaincode recientes
      parameters:
        - { in: query, name: limite, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { in: query, name: desde, schema: { type: string } }
        - { in: query, name: hasta, schema: { type: string } }
      responses:
        '200': { description: Objeto combinado, content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaLectura' } } } }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /api/auditoria/http:
    get:
      security: [{ ApiKeyAuth: [] }]
      tags: [auditoria]
      summary: Alias de /auditoria/http (prefijo /api)
      parameters:
        - { in: query, name: limite, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { in: query, name: desde, schema: { type: string } }
        - { in: query, name: hasta, schema: { type: string } }
      responses:
        '200': { description: Líneas de auditoría, content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaLectura' } } } }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /api/auditoria/combinada:
    get:
      security: [{ ApiKeyAuth: [] }]
      tags: [auditoria]
      summary: Alias de /auditoria/combinada (prefijo /api)
      parameters:
        - { in: query, name: limite, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { in: query, name: desde, schema: { type: string } }
        - { in: query, name: hasta, schema: { type: string } }
      responses:
        '200': { description: Objeto combinado, content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaLectura' } } } }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /admin/notificaciones:
    get:
      security: [{ ApiKeyAuth: [] }]
      tags: [auditoria]
      summary: Historial de notificaciones admin del tenant
      responses:
        '200':
          description: Historial de notificaciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  tenant: { type: string }
                  total: { type: integer }
                  items: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /admin/notificaciones/stream:
    get:
      security: [{ ApiKeyAuth: [] }]
      tags: [auditoria]
      summary: Stream SSE de notificaciones admin del tenant
      responses:
        '200': { description: Flujo text/event-stream, content: { text/event-stream: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/SinCredencial' }
        '403': { $ref: '#/components/responses/SinPermiso' }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        Credencial del consumidor. El servidor resuelve tenant + rol a partir de
        la clave (config/tenants.yaml o variables legacy).

  responses:
    SinCredencial:
      description: Falta la cabecera X-API-Key
      content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaError' } } }
    SinPermiso:
      description: API key inválida o rol sin permiso
      content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaError' } } }
    NoEncontrado:
      description: Recurso no encontrado
      content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaError' } } }
    Validacion:
      description: Error de validación o JSON inválido
      content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaError' } } }

  schemas:
    EntradaDato:
      type: object
      required: [datoId, tipo, payload]
      properties:
        datoId: { type: string, minLength: 1, example: PARCELA-001 }
        tipo: { type: string, minLength: 1, example: parcela }
        payload:
          description: JSON libre de negocio (cualquier estructura).
          oneOf:
            - type: object
            - type: array
              items: { type: object }

    Solicitud:
      type: object
      properties:
        id: { type: string }
        tenant: { type: string }
        operacion: { type: string, enum: [crear, actualizar, eliminar, restaurar] }
        datoId: { type: string }
        tipoDato: { type: string }
        payload: {}
        txIdOrigen: { type: string }
        solicitante: { type: string }
        solicitanteNombre: { type: string }
        estado: { type: string, enum: [pendiente, aprobada, rechazada] }
        creadaEn: { type: string, format: date-time }
        resueltaEn: { type: string, format: date-time }
        resueltaPor: { type: string }
        motivo: { type: string }
        txIdResultado: { type: string }

    SolicitudInvocacionChaincode:
      type: object
      required: [contrato, funcion, modo]
      properties:
        canal: { type: string, description: Opcional; por defecto el canal del tenant }
        contrato: { type: string, minLength: 1 }
        funcion: { type: string, minLength: 1 }
        parametros: { type: array, items: { type: string } }
        modo: { type: string, enum: [evaluate, submit] }

    RespuestaLectura:
      type: object
      required: [ok, codigo, mensaje, datos]
      properties:
        ok: { type: boolean, example: true }
        codigo: { type: string, example: CONSULTA_EXITOSA }
        mensaje: { type: string }
        datos:
          oneOf:
            - type: object
            - type: array
              items: { type: object }
            - type: string
            - type: number
            - type: integer
            - type: boolean
        payloadDecodificado:
          nullable: true
        payloadRaw: { type: string }

    RespuestaExitoTx:
      type: object
      required: [ok, txId, mensaje]
      properties:
        ok: { type: boolean, example: true }
        txId: { type: string }
        mensaje: { type: string }

    RespuestaPendiente:
      type: object
      required: [ok, estado, solicitudId]
      properties:
        ok: { type: boolean, example: true }
        estado: { type: string, example: pendiente }
        solicitudId: { type: string }
        operacion: { type: string }
        mensaje: { type: string }

    RespuestaError:
      type: object
      required: [ok, codigo, mensaje]
      properties:
        ok: { type: boolean, example: false }
        codigo: { type: string }
        mensaje: { type: string }
