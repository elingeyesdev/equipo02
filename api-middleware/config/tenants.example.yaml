# tenants.example.yaml — Configuración multi-tenant del api-middleware (BaaS universal)
#
# Copiar a `config/tenants.yaml` y rellenar valores. NO commitear `tenants.yaml`
# con cert/llave reales: ya está en .gitignore.
#
# Activación: definir TENANTS_FILE=./config/tenants.yaml en el .env
# Si TENANTS_FILE no está definido o el archivo no existe, el middleware
# arranca en modo single-tenant legacy (variables MSPID/CERT_PATH/... + dato_cc).
#
# MODELO UNIVERSAL: todos los tenants usan el chaincode genérico `dato_cc`
# (activos {datoId, tipo, payload JSON}). Cada tenant = una empresa = un canal
# Fabric privado + al menos una API key por rol.
#
# default: id del tenant usado para las claves legacy (API_KEY_ADMIN / ...).

default: agricultura

tenants:
  # ─────────────────────────────────────────────────────────────────────────
  # Tenant 1 — Ejemplo de dominio "agricultura" (parcelas, cosechas).
  # ─────────────────────────────────────────────────────────────────────────
  agricultura:
    nombre: "Administradora de Agricultura"
    descripcion: "Empresa cliente. Modelo genérico (JSON libre) sobre dato_cc."
    msp_id: "Org1MSP"
    cert_path: "/ruta/a/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/signcerts/cert.pem"
    key_path_dir: "/ruta/a/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/keystore"
    tls_cert_path: "/ruta/a/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt"
    peer_endpoint: "localhost:7051"
    peer_host_alias: "peer0.org1.example.com"
    canal: "agricultura"
    chaincode: "dato_cc"
    api_keys:
      "agri-admin-2026": admin
      "agri-int-2026":   integrador
      "agri-lect-2026":  solo_lectura
    notificaciones:
      activado: true
      eventos:
        - dato.creado
        - dato.editado
        - dato.eliminado
        - dato.restaurado
        - solicitud.creada
      roles_actor:
        - integrador
      destinos:
        - tipo: email
          asunto: "[Agricultura] {tipo} → {recurso}"
          destinatarios:
            - admin-agri@empresa.com
        # SSE es implícito: la consola admin se conecta a
        # GET /admin/notificaciones/stream con su X-API-Key de rol admin.

  # ─────────────────────────────────────────────────────────────────────────
  # Tenant 2 — Ejemplo de dominio distinto "salud" (expedientes clínicos).
  # Demuestra que la MISMA API sirve a cualquier sistema y que los tenants
  # están aislados (canal Fabric distinto).
  # ─────────────────────────────────────────────────────────────────────────
  salud:
    nombre: "Centro de Salud Demo"
    descripcion: "Empresa cliente de otro dominio. Mismo modelo genérico dato_cc."
    msp_id: "Org2MSP"
    cert_path: "/ruta/a/peerOrganizations/org2.example.com/users/Admin@org2.example.com/msp/signcerts/cert.pem"
    key_path_dir: "/ruta/a/peerOrganizations/org2.example.com/users/Admin@org2.example.com/msp/keystore"
    tls_cert_path: "/ruta/a/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls/ca.crt"
    peer_endpoint: "localhost:9051"
    peer_host_alias: "peer0.org2.example.com"
    canal: "salud"
    chaincode: "dato_cc"
    api_keys:
      "salud-admin-2026": admin
      "salud-int-2026":   integrador
      "salud-lect-2026":  solo_lectura
    notificaciones:
      activado: true
      eventos:
        - dato.creado
        - dato.editado
        - dato.eliminado
        - dato.restaurado
        - solicitud.creada
      roles_actor:
        - integrador
      destinos:
        - tipo: email
          asunto: "[Salud] {tipo} → {recurso}"
          destinatarios:
            - admin-salud@empresa.com
