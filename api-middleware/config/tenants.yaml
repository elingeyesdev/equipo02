# tenants.yaml — Configuración multi-tenant REAL del api-middleware (BaaS universal)
#
# MODELO UNIVERSAL: todos los tenants usan el chaincode genérico `dato_cc`.
# Cada tenant = una empresa = un canal Fabric privado + API keys por rol.
#
# NOTA: el canal "salud" debe existir en la red. Crearlo con:
#   ./scripts/fabric-despliegue/agregar_tenant.sh salud Org1
# (ver docs/onboarding-cliente-nuevo.md).

default: agricultura

tenants:
  # Tenant que ya opera sobre la test-network (Org2, canal agricultura).
  agricultura:
    nombre: "Administradora de Agricultura"
    descripcion: "Empresa cliente (dominio agro). Modelo genérico dato_cc."
    msp_id: "Org2MSP"
    cert_path: "../red-hyperledger/test-network/organizations/peerOrganizations/org2.example.com/users/Admin@org2.example.com/msp/signcerts/cert.pem"
    key_path_dir: "../red-hyperledger/test-network/organizations/peerOrganizations/org2.example.com/users/Admin@org2.example.com/msp/keystore"
    tls_cert_path: "../red-hyperledger/test-network/organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls/tlscacerts/tls-localhost-8054-ca-org2.pem"
    peer_endpoint: "localhost:9051"
    peer_host_alias: "peer0.org2.example.com"
    canal: "agricultura"
    chaincode: "dato_cc"
    api_keys:
      "agri-admin-2026": admin
      "agri-int-2026": integrador
      "agri-lect-2026": solo_lectura
    notificaciones:
      activado: true
      eventos:
        - dato.creado
        - dato.editado
        - dato.eliminado
        - dato.restaurado
        - solicitud.creada
      roles_actor:
        - integrador
      destinos:
        - tipo: email
          asunto: "[Agricultura] {tipo} → {recurso}"
          destinatarios:
            - admin-agri@empresa.com

  # Segundo tenant de dominio distinto (Org1, canal salud) para demostrar
  # universalidad + aislamiento en vivo. Requiere crear el canal "salud".
  salud:
    nombre: "Centro de Salud Demo"
    descripcion: "Empresa cliente (dominio salud). Mismo modelo genérico dato_cc."
    msp_id: "Org1MSP"
    cert_path: "../red-hyperledger/test-network/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/signcerts/cert.pem"
    key_path_dir: "../red-hyperledger/test-network/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/keystore"
    tls_cert_path: "../red-hyperledger/test-network/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/tlscacerts/tls-localhost-7054-ca-org1.pem"
    peer_endpoint: "localhost:7051"
    peer_host_alias: "peer0.org1.example.com"
    canal: "salud"
    chaincode: "dato_cc"
    api_keys:
      "salud-admin-2026": admin
      "salud-int-2026": integrador
      "salud-lect-2026": solo_lectura
    notificaciones:
      activado: true
      eventos:
        - dato.creado
        - dato.editado
        - dato.eliminado
        - dato.restaurado
        - solicitud.creada
      roles_actor:
        - integrador
      destinos:
        - tipo: email
          asunto: "[Salud] {tipo} → {recurso}"
          destinatarios:
            - admin-salud@empresa.com
