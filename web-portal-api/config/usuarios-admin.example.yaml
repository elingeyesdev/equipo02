# Configuración de usuarios de la Consola BaaS (web-cliente-demo).
# Operadores humanos con acceso a explorar, auditar y (según rol) proponer
# cambios sobre el modelo universal /datos del api-middleware.
#
# Generar hash bcrypt:
#   cd web-portal-api && go run ./cmd/bcrypt-gen "mi-contrasena"
#
# El frontend NUNCA ve la X-API-Key: el BFF la inyecta en /admin/api/* según
# (tenant, rol) definidos aquí. Deben coincidir con tenants.yaml del middleware.

default_tenant: agricultura

tenants:
  agricultura:
    nombre: "Administradora de Agricultura"
    api_keys:
      admin: agri-admin-2026
      integrador: agri-int-2026
      lectura: agri-lect-2026
  salud:
    nombre: "Centro de Salud Demo"
    api_keys:
      admin: salud-admin-2026
      integrador: salud-int-2026
      lectura: salud-lect-2026

usuarios:
  - usuario: olga
    nombre_completo: "Olga Roque"
    rol: admin
    tenant: agricultura
    contrasena_hash: "REEMPLAZAR_CON_BCRYPT"

  - usuario: tomas
    nombre_completo: "Tomás Quispe"
    rol: integrador
    tenant: agricultura
    contrasena_hash: "REEMPLAZAR_CON_BCRYPT"

  - usuario: rosa
    nombre_completo: "Rosa Auditora"
    rol: lectura
    tenant: agricultura
    contrasena_hash: "REEMPLAZAR_CON_BCRYPT"

  - usuario: sara
    nombre_completo: "Sara Admin Salud"
    rol: admin
    tenant: salud
    contrasena_hash: "REEMPLAZAR_CON_BCRYPT"

  - usuario: hugo
    nombre_completo: "Hugo Integrador Salud"
    rol: integrador
    tenant: salud
    contrasena_hash: "REEMPLAZAR_CON_BCRYPT"

  - usuario: elsa
    nombre_completo: "Elsa Auditora Salud"
    rol: lectura
    tenant: salud
    contrasena_hash: "REEMPLAZAR_CON_BCRYPT"
