# Archivo REAL de cuentas de la Consola BaaS (web-cliente-demo).
# Ver config/usuarios-admin.example.yaml para la documentación completa.
#
# Modelo UNIVERSAL: dos tenants de dominios distintos para la demo.
#
# Contraseñas de demo (NO usar en producción):
#   AGRICULTURA (dominio agro):
#     olga  / olga-agri-2026     (admin)
#     tomas / tomas-agri-2026    (integrador)
#     rosa  / rosa-agri-2026     (lectura)
#   SALUD (dominio clínico):
#     sara  / sara-salud-2026    (admin)
#     hugo  / hugo-salud-2026    (integrador)
#     elsa  / elsa-salud-2026    (lectura)

default_tenant: agricultura

tenants:
  agricultura:
    nombre: "Administradora de Agricultura"
    api_keys:
      admin: agri-admin-2026
      integrador: agri-int-2026
      lectura: agri-lect-2026
  salud:
    nombre: "Centro de Salud Demo"
    api_keys:
      admin: salud-admin-2026
      integrador: salud-int-2026
      lectura: salud-lect-2026

usuarios:
  # --- Tenant agricultura ---
  - usuario: olga
    nombre_completo: "Olga Roque"
    rol: admin
    tenant: agricultura
    contrasena_hash: "$2a$10$YMAwVjbhD8oVerg3YD6OTuxVfF1lEaDfdS9JjXLgWbkOWKpvU/0de"

  - usuario: tomas
    nombre_completo: "Tomás Quispe"
    rol: integrador
    tenant: agricultura
    contrasena_hash: "$2a$10$ooxHKcsWk0tGXKxDQf1cP.l94qrS0MQiJN3ZQtB9Bjixmdlef2xpy"

  - usuario: rosa
    nombre_completo: "Rosa Auditora"
    rol: lectura
    tenant: agricultura
    contrasena_hash: "$2a$10$xwXhCfgOGLnFCHLQt9V3oe1yQXwaFCz8Stm5hWvJ6krlV9QQzFnCS"

  # --- Tenant salud ---
  - usuario: sara
    nombre_completo: "Sara Admin Salud"
    rol: admin
    tenant: salud
    contrasena_hash: "$2a$10$oyV1evue88IMnbGuwfNWou8H/BYdFrWsUpu/IO351ctZpDc5JtMvC"

  - usuario: hugo
    nombre_completo: "Hugo Integrador Salud"
    rol: integrador
    tenant: salud
    contrasena_hash: "$2a$10$CnN5MDe/tiedQSRXIyPsduf5cYvqHbz5gIl9tjYJyQUnUmvXJ7SAa"

  - usuario: elsa
    nombre_completo: "Elsa Auditora Salud"
    rol: lectura
    tenant: salud
    contrasena_hash: "$2a$10$P.bFWn6/VAbTkNdRPG/xwebv1JnmkKF3SR8UPAj4pyOwwGFRNkGBG"
